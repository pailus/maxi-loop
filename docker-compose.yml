services:
  postgres:
    image: postgres:16-alpine
    container_name: maxi-loop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maxi_loop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-maxi_loop}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - maxi_loop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxi_loop} -d ${POSTGRES_DB:-maxi_loop}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  maxi_loop_pgdata:
