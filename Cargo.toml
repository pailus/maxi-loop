[workspace]
resolver = "3"
members = [
    "crates/platform",
    "crates/auth",
    "crates/org",
    "crates/ingest",
    "crates/issues",
    "crates/retention",
    "crates/alerts",
    "crates/performance",
    "crates/sourcemaps",
    "crates/mcp",
    "crates/server",
    "crates/loadgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
argon2 = { version = "0.5", features = ["std", "password-hash"] }
axum = "0.8"
base64 = "0.22"
brotli = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dotenvy = "0.15"
flate2 = "1"
governor = "0.8"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = "2"
password-hash = { version = "0.5", features = ["rand_core", "std"] }
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sourcemap = "9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "chrono"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
webpki-roots = "0.26"
zstd = "0.13"

maxi-loop-platform = { path = "crates/platform" }
maxi-loop-auth = { path = "crates/auth" }
maxi-loop-org = { path = "crates/org" }
maxi-loop-ingest = { path = "crates/ingest" }
maxi-loop-issues = { path = "crates/issues" }
maxi-loop-retention = { path = "crates/retention" }
maxi-loop-alerts = { path = "crates/alerts" }
maxi-loop-performance = { path = "crates/performance" }
maxi-loop-sourcemaps = { path = "crates/sourcemaps" }
maxi-loop-mcp = { path = "crates/mcp" }
